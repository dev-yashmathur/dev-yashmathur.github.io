<!doctype html>
<!-- Social preview card for /portee. Render: node scripts/og/render.mjs portee -->
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@500&family=Source+Sans+3:wght@600&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #f7f1de; color: #4e220f; font-family: "Source Sans 3", sans-serif; position: relative; }
  .copy { position: absolute; left: 72px; top: 68px; width: 520px; }
  .brand { display: flex; align-items: center; gap: 14px; font: 600 34px/1 Fraunces, serif; }
  .brand img { width: 56px; height: 56px; border-radius: 13px; }
  h1 { margin-top: 44px; font: 600 58px/1.04 Fraunces, serif; letter-spacing: -.02em; }
  .meta { position: absolute; left: 72px; bottom: 64px; font: 500 18px/1.6 "IBM Plex Mono", monospace; letter-spacing: .02em; color: #6a5746; }
  .stage { position: absolute; left: 640px; top: 70px; width: 640px; height: 600px; background: #b0ba99; border-radius: 34px 0 0 0; padding: 40px 0 0 40px; }
  .win { width: 760px; border-radius: 14px 0 0 0; overflow: hidden; background: #fffdf6; border: 1px solid rgba(78,34,15,.16); box-shadow: 0 30px 60px -30px rgba(78,34,15,.5); }
  .bar { display: flex; gap: 8px; padding: 12px 14px; background: #ede7cf; border-bottom: 1px solid rgba(78,34,15,.16); }
  .bar i { width: 12px; height: 12px; border-radius: 50%; background: rgba(78,34,15,.18); }
  .win img { display: block; width: 100%; }
</style></head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../src/assets/images/Portee/portee-icon.svg" />Portée</div>
    <h1>See what your coding agents are really costing your Mac.</h1>
  </div>
  <div class="meta">Free for macOS<br />Claude Code · Codex · Cursor · OpenCode</div>
  <div class="stage"><div class="win"><div class="bar"><i></i><i></i><i></i></div><img src="../../src/assets/images/Portee/storage-review.webp" /></div></div>
</body></html>

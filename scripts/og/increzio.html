<!doctype html>
<!-- Social preview card for /increzio. Render: node scripts/og/render.mjs increzio -->
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative; color: #303030; font-family: Quicksand, sans-serif;
    background: #f8f8f6 radial-gradient(rgba(48,48,48,.08) 1.2px, transparent 1.6px) 0 0 / 24px 24px;
  }
  .copy { position: absolute; left: 72px; top: 66px; width: 600px; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 36px; font-weight: 700; }
  .brand img { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #303030; }
  .sticker {
    display: inline-block; margin-top: 40px; padding: 8px 18px; transform: rotate(-2deg);
    background: #b3d7f5; border: 3px solid #303030; border-radius: 14px; box-shadow: 0 4px 0 #303030; font-size: 22px; font-weight: 700;
  }
  h1 { margin-top: 26px; font-size: 62px; line-height: 1.06; font-weight: 700; letter-spacing: -.02em; }
  .mark { position: relative; white-space: nowrap; }
  .mark svg { position: absolute; left: 0; bottom: -6px; width: 100%; height: 18px; z-index: -1; }
  .meta { position: absolute; left: 72px; bottom: 60px; font-size: 22px; font-weight: 600; color: #5f5f5f; }
  .phone { position: absolute; padding: 10px; border-radius: 44px; background: #303030; box-shadow: 0 30px 60px -30px rgba(48,48,48,.6); }
  .phone img { display: block; width: 100%; border-radius: 34px; }
  .p1 { left: 760px; top: 70px; width: 300px; transform: rotate(-4deg); }
  .p2 { left: 960px; top: 150px; width: 280px; transform: rotate(5deg); }
  .note { position: absolute; left: 700px; top: 40px; font-size: 26px; font-weight: 700; color: #2f6690; transform: rotate(-7deg); }
</style></head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../src/assets/images/IncrezioHabitTracker/lp-icon.webp" />Increzio</div>
    <div class="sticker">Habit tracker for Android</div>
    <h1>Tiny daily habits, right on your <span class="mark">home screen.<svg viewBox="0 0 300 18" preserveAspectRatio="none"><path d="M4 12c40-6 90-9 146-8 52 1 98 3 146-2" fill="none" stroke="#7aa5c5" stroke-width="6" stroke-linecap="round"/></svg></span></h1>
  </div>
  <div class="meta">Widgets · 1% goals · Custom day reset · Free on Google Play</div>
  <div class="phone p1"><img src="../../src/assets/images/IncrezioHabitTracker/lp-widget.webp" /></div>
  <div class="phone p2"><img src="../../src/assets/images/IncrezioHabitTracker/lp-home.webp" /></div>
</body></html>

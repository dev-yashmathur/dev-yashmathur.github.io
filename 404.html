  <script>
    // Paint the right background before React loads, so dark mode doesn't flash white.
    (function () {
      try {
        var t = localStorage.getItem('pf-theme');
        var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        var c = dark ? '#121211' : '#f7f7f5';
        document.documentElement.style.backgroundColor = c;
        document.body.style.background = c;
      } catch (e) { /* ignore */ }
    })();
  </script>
  <!--/theme-->
  <div id="root"></div>
  <!--theme-->
  <script>
    // Prerendered markup is built in light mode; switch it before first paint if the visitor prefers dark.
    (function () {
      try {
        var t = localStorage.getItem('pf-theme');
        var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        var el = document.querySelector('#root .pf');
        if (el) el.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) { /* ignore */ }
    })();
  </script>
  <!--/theme-->
